name: reviewer relay health

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reviewer-relay-keep-warm
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify the no-secret reviewer ingress
        run: >-
          curl --fail-with-body --silent --show-error
          --max-time 75 --retry 2 --retry-all-errors
          https://okx-agent-review-relay.qdworld001.workers.dev/health
      - name: Verify the canonical Conviction reviewer path
        run: >-
          curl --fail-with-body --silent --show-error
          --max-time 75 --retry 2 --retry-all-errors
          https://okx-agent-review-relay.qdworld001.workers.dev/conviction/api/health
